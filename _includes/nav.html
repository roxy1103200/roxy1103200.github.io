<header class="site-header">
  <nav class="nav-container" aria-label="主导航">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} 首页">
      {% include icon.html name="code" %}<span>{{ site.profile.name | escape }}<span class="logo-accent">.Log</span></span>
    </a>
    <div class="nav-actions">
      <a class="nav-link" href="{{ '/' | relative_url }}#posts">文章记录</a>
      {% if site.profile.github %}
      <a class="github-button" href="{{ site.profile.github | escape }}" target="_blank" rel="noopener noreferrer" aria-label="访问 {{ site.profile.name | escape }} 的 GitHub 主页（新窗口）">
        {% include icon.html name="github" %}<span>GitHub</span>
      </a>
      {% endif %}
    </div>
  </nav>
</header>
